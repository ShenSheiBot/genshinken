# 公开内容 push 到 main 后，把文章、书籍或专题 URL 推送给 IndexNow（Bing 数小时内收录）。
# Google 不参与 IndexNow，靠 sitemap lastmod 自然重抓。
name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - "source/_posts/**"
      - "source/_books/**"
      - "source/_topics/**"

# Least-privilege: this job only reads the repository to diff changed content.
permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so a multi-commit push can diff github.event.before..sha.
          fetch-depth: 0

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.20.0"

      - name: 收集本次变更的公开内容
        run: |
          BEFORE='${{ github.event.before }}'
          # First push to the branch (before = all-zero) or missing base: fall back to HEAD^.
          if ! git rev-parse --quiet --verify "$BEFORE^{commit}" >/dev/null 2>&1; then
            BEFORE=$(git rev-parse --quiet --verify HEAD^ 2>/dev/null || git rev-parse HEAD)
          fi
          # A = added, M = modified, R = renamed (new path). Renamed-away / deleted
          # URLs 404 naturally and get de-indexed; submitting them needs the old blob
          # (the submitter reads files that must still exist), out of scope here.
          git diff --name-only --diff-filter=AMR "$BEFORE" '${{ github.sha }}' -- \
            'source/_posts/*.md' \
            'source/_books/*.json' \
            'source/_topics/*.md' > changed.txt
          echo "变更清单："
          cat changed.txt

      - name: 提交到 IndexNow（先轮询部署就绪，替代盲等 sleep）
        run: node scripts/indexnow-submit.mjs --list changed.txt --verify
