name: Browser suite

on:
  # Gate main directly and every PR; feature-branch pushes are covered by their PR.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: browser-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reader-browser-suite:
    name: Chromium and WebKit reader suite
    permissions:
      contents: read
    uses: UCCTB/web-test-platform/.github/workflows/playwright.yml@fd4527bfed95e44d5ae48ad4707295d199cd5418
    with:
      node-version: "22.20.0"
      working-directory: "."
      playwright-config: "playwright.config.ts"
      artifact-retention-days: 14
