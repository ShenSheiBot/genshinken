name: Quality

on:
  # Gate main directly and every PR; feature-branch pushes are covered by their PR,
  # so this avoids the double run (push + pull_request) on same-repo branches.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装锁定依赖
        run: npm ci

      - name: 运行完整质量门禁
        run: npm run check

      - name: 构建生产版本
        run: npm run build

      - name: 回归生产构建
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/un-canon-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/un-canon-next.log
            exit 1
          fi

          npm run verify:release -- http://127.0.0.1:3000
